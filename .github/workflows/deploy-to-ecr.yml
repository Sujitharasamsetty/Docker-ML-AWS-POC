name: Full ECS Deployment

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Ensure ECR Repository exists
      run: |
        aws ecr describe-repositories --repository-names myapi || \
        aws ecr create-repository --repository-name myapi

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build and push Docker image
      run: |
        IMAGE_URI=441778934276.dkr.ecr.us-east-1.amazonaws.com/myapi:latest
        docker build -t $IMAGE_URI .
        docker push $IMAGE_URI

    - name: Render ECS task definition
      id: render
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ecs-task-def.json
        container-name: myapi
        image: 441778934276.dkr.ecr.us-east-1.amazonaws.com/myapi:latest

    - name: Deploy to Amazon ECS
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.render.outputs.task-definition }}
        service: api-ml-task
        cluster: myapi-cluster1
        wait-for-service-stability: true
